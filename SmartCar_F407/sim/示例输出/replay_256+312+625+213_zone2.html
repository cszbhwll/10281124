<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小车仿真回放</title>
<style>
:root{
  --bg:#f4f3ef; --panel:#ffffff; --ink:#1d1f21; --quiet:#6b6f73; --line:#d9d6cf;
  --field:#e4e2dc; --lane:#9aa79f; --forbid:#f6edc2; --forbid-edge:#cdbb6a;
  --zone:#ffffff; --start:#6f8fd8; --accent:#c4561c; --arm:#d9822b; --car:#4a5560; --car-top:#eef0f1;
  --trail-a:#d43c3c; --trail-b:#2f6fd0; --now:#fff3d6;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16181a; --panel:#1f2225; --ink:#e8e6e1; --quiet:#9a9ea3; --line:#34383c;
    --field:#2a2d30; --lane:#5f6f66; --forbid:#4a4430; --forbid-edge:#8a7a3a;
    --zone:#3a3d40; --start:#3c5590; --accent:#f08a4b; --arm:#f0a050; --car:#a9b4be; --car-top:#33383d;
    --trail-a:#f06a6a; --trail-b:#6aa0f0; --now:#3a3222;
  }
}
:root[data-theme="dark"]{
  --bg:#16181a; --panel:#1f2225; --ink:#e8e6e1; --quiet:#9a9ea3; --line:#34383c;
  --field:#2a2d30; --lane:#5f6f66; --forbid:#4a4430; --forbid-edge:#8a7a3a;
  --zone:#3a3d40; --start:#3c5590; --accent:#f08a4b; --arm:#f0a050; --car:#a9b4be; --car-top:#33383d;
  --trail-a:#f06a6a; --trail-b:#6aa0f0; --now:#3a3222;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "PingFang SC","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif}
header{padding:16px 20px 8px}
h1{font-size:20px;margin:0 0 4px}
.sub{color:var(--quiet);font-size:13px}
main{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;padding:8px 20px 20px;max-width:1280px}
@media (max-width:900px){main{grid-template-columns:1fr;padding:8px 16px 16px}header{padding:16px 16px 8px}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
#fieldWrap{position:relative}
canvas{display:block;width:100%}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
button,select{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;min-width:72px}
input[type=range]{flex:1;min-width:160px;accent-color:var(--accent)}
.time{font-variant-numeric:tabular-nums;min-width:120px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.stat{border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.stat span{color:var(--quiet);font-size:12px}
.phase{font-weight:600;margin:4px 0 10px}
.side h3{font-size:13px;margin:10px 0 6px;color:var(--quiet);font-weight:600}
#log{height:340px;overflow:auto;font:12px/1.55 ui-monospace,Consolas,"Noto Sans Mono CJK SC",monospace;border:1px solid var(--line);border-radius:8px;padding:6px}
#log div{padding:0 4px;border-radius:4px;cursor:pointer;white-space:pre-wrap;word-break:break-all}
#log div.future{color:var(--quiet);opacity:.55}
#log div.cur{background:var(--now)}
#log div.sim{color:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--quiet);margin-top:8px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:4px;vertical-align:-2px}
.summary{margin-top:6px;font-size:13px}
</style>
</head>
<body>
<header>
  <h1>智能搬运小车 · 整场仿真回放</h1>

<main>
  <section class="card" id="fieldWrap">

    <div class="legend" id="legend"></div>

    <h3>程序日志（点一行可跳到那个时刻）</h3>
    <div id="log"></div>
  </aside>
</main>

$('legend').innerHTML = Object.values(COLORS).map(c => `<span><i style="background:${c[0]}"></i>${c[1]}</span>`).join('') +
  '<span>线条：小车走过的路线（红→蓝 表示先→后）</span>';

/* ---------- 场地画布 ---------- */
const cv = $('field'), cx = cv.getContext('2d');
const X0 = -220, X1 = 2640, Y0 = -160, Y1 = 2700;          // 显示范围（mm）
let S = 1, DPR = 1;
function fit(){
  const w = cv.clientWidth, dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(w * dpr); cv.height = Math.round(w * dpr);
  S = cv.width / (X1 - X0);
  const aw = $('arm').clientWidth;
  $('arm').width = Math.round(aw * dpr); $('arm').height = Math.round(aw * 0.7 * dpr); DPR = dpr;
  draw();
}
const px = x => (x - X0) * S, py = y => (Y1 - y) * S;

function rect(x0, y0, x1, y1, fill, stroke){
  cx.beginPath(); cx.rect(px(x0), py(y1), (x1 - x0) * S, (y1 - y0) * S);
  if (fill){ cx.fillStyle = fill; cx.fill(); }
  if (stroke){ cx.strokeStyle = stroke; cx.lineWidth = 1; cx.stroke(); }
}
function label(t, x, y, size, color, align){
  cx.fillStyle = color || css('--ink'); cx.font = `${Math.max(10, size * S)}px "PingFang SC","Microsoft YaHei",sans-serif`;
  cx.textAlign = align || 'center'; cx.textBaseline = 'middle'; cx.fillText(t, px(x), py(y));
}
const EDGES = [[0,1],[1,2],[3,4],[4,5],[6,7],[7,8],[0,3],[3,6],[1,4],[4,7],[2,5],[5,8]];
const RING_R = [26.5, 29, 32.5, 37.5, 42.5, 47.5];

function drawField(){
  cx.fillStyle = css('--bg'); cx.fillRect(0, 0, cv.width, cv.height);
  rect(0, 0, 2400, 2400, css('--field'), css('--quiet'));
  for (const [a, b] of [[550,550],[1400,550],[550,1400],[1400,1400]]) rect(a, b, a + 450, b + 450, css('--forbid'), css('--forbid-edge'));
  label('禁行区', 775, 775, 48, css('--quiet'));
  rect(910, 0, 1490, 150, css('--zone'), css('--quiet')); label('粗加工区', 1200, 196, 50, css('--ink'));
  rect(0, 910, 150, 1490, css('--zone'), css('--quiet')); label('暂存区', 75, 1540, 50, css('--ink'));
  for (const [z, n, x, y] of FD.rings){
    cx.strokeStyle = css('--quiet'); cx.lineWidth = Math.max(0.6, 1.5 * S);
    for (const r of RING_R){ cx.beginPath(); cx.arc(px(x), py(y), r * S, 0, 7); cx.stroke(); }
    // 圆环编号：粗加工区写在场地下方，暂存区写在场地左侧
    if (z === 0) label(n + '号', x, -70, 44, css('--ink')); else label(n + '号', -110, y, 44, css('--ink'));
  }
  rect(2100, 2100, 2400, 2400, css('--start')); label('启停区1', 2250, 2250, 46, '#fff');
  rect(2100, 0, 2400, 300, css('--start')); label('启停区2', 2250, 150, 46, '#fff');
  cx.beginPath(); cx.arc(px(FD.tt[0]), py(FD.tt[1]), 150 * S, 0, 7); cx.fillStyle = css('--zone'); cx.fill(); cx.strokeStyle = css('--quiet'); cx.stroke();
  label('原料转盘', FD.tt[0], FD.tt[1] + 190, 46, css('--ink'));
  rect(2400, 1050, 2420, 1350, css('--ink')); label('二维码板', 2510, 1440, 44, css('--ink'));
  cx.setLineDash([6, 5]); cx.strokeStyle = css('--lane'); cx.lineWidth = 1;
  for (const [a, b] of EDGES){ const p = FD.nodes[a], q = FD.nodes[b]; cx.beginPath(); cx.moveTo(px(p[0]), py(p[1])); cx.lineTo(px(q[0]), py(q[1])); cx.stroke(); }
  cx.setLineDash([]);
  // 障碍物（黑色 φ50；被车碰到过的画成红色）和程序最后记下的障碍物位置（蓝色虚线圈）
  for (const [x, y, hit] of (FD.obstacles || [])){ cx.beginPath(); cx.arc(px(x), py(y), 25 * S, 0, 7); cx.fillStyle = hit ? '#d23c35' : '#1d2226'; cx.fill(); }
  cx.setLineDash([4, 3]); cx.strokeStyle = '#2a7fb8'; cx.lineWidth = 1.5;
  for (const [x, y] of (FD.obs_found || [])){ cx.beginPath(); cx.arc(px(x), py(y), 45 * S, 0, 7); cx.stroke(); }
  cx.setLineDash([]);
}

function drawTrail(k){
  const a = css('--trail-a'), b = css('--trail-b');
  cx.lineWidth = Math.max(1.2, 6 * S); cx.lineCap = 'round';
  const step = 2;
  for (let i = step; i <= k; i += step){
    const f0 = F[i - step], f1 = F[i], u = f1[0] / T_END;
    cx.strokeStyle = u < 0.5 ? a : b; cx.globalAlpha = 0.55;
    cx.beginPath(); cx.moveTo(px(f0[1]), py(f0[2])); cx.lineTo(px(f1[1]), py(f1[2])); cx.stroke();
  }
  cx.globalAlpha = 1;
}

function mat(x, y, z, color, loc){
  const c = COLORS[color] ? COLORS[color][0] : '#888';
  cx.save(); cx.translate(px(x), py(y));
  if (loc === 5){ cx.rotate(0.6); cx.fillStyle = c; cx.fillRect(-30 * S, -25 * S, 60 * S, 50 * S); cx.restore(); return; }
  cx.beginPath(); cx.arc(0, 0, 25 * S, 0, 7); cx.fillStyle = c; cx.fill();
  cx.lineWidth = Math.max(0.8, 2 * S); cx.strokeStyle = 'rgba(0,0,0,.45)'; cx.stroke();
  cx.beginPath(); cx.arc(0, 0, 15 * S, 0, 7); cx.strokeStyle = 'rgba(255,255,255,.75)'; cx.stroke();
  cx.restore();
}

function drawRobot(f){
  const [t, x, y, th, q0, q1, q2, g] = f;
  cx.save(); cx.translate(px(x), py(y)); cx.rotate(-th);
  const L = R.hl * S, W = R.hw * S;
  // 车身与麦轮
  cx.fillStyle = css('--car-top'); cx.strokeStyle = css('--car'); cx.lineWidth = Math.max(1, 3 * S);
  cx.beginPath(); cx.rect(-L, -W + 32 * S, 2 * L, 2 * W - 64 * S); cx.fill(); cx.stroke();
  cx.fillStyle = css('--car');
  for (const sx of [-1, 1]) for (const sy of [-1, 1]) cx.fillRect(sx * (L - 34 * S) - 30 * S, sy * (W - 16 * S) - 16 * S, 60 * S, 32 * S);
  // 车头三角
  cx.beginPath(); cx.moveTo(L + 2 * S, 0); cx.lineTo(L - 30 * S, 22 * S); cx.lineTo(L - 30 * S, -22 * S); cx.closePath(); cx.fillStyle = css('--accent'); cx.fill();
  // 载物槽（车体坐标：x 向前，y 向左；画布 y 向下所以取负）
  cx.lineWidth = Math.max(0.8, 2 * S); cx.strokeStyle = css('--car');
  for (const [sx, sy] of R.slots){ cx.beginPath(); cx.arc(sx * S, -sy * S, 41 * S, 0, 7); cx.stroke(); }
  cx.restore();
}

function drawArm(f){
  const [t, x, y, th, q0, q1, q2, g] = f;
  const re = R.r0 + R.l1 * Math.cos(q1), rt = re + R.l2 * Math.cos(q1 + q2);
  const toField = (rx, ry) => [x + rx * Math.cos(th) - ry * Math.sin(th), y + rx * Math.sin(th) + ry * Math.cos(th)];
  const b = toField(R.bx, R.by), e = toField(R.bx + re * Math.cos(q0), R.by + re * Math.sin(q0)), p = toField(R.bx + rt * Math.cos(q0), R.by + rt * Math.sin(q0));
  cx.lineCap = 'round'; cx.strokeStyle = css('--arm'); cx.lineWidth = Math.max(2, 18 * S);
  cx.beginPath(); cx.moveTo(px(b[0]), py(b[1])); cx.lineTo(px(e[0]), py(e[1])); cx.lineTo(px(p[0]), py(p[1])); cx.stroke();
  cx.beginPath(); cx.arc(px(b[0]), py(b[1]), 30 * S, 0, 7); cx.fillStyle = css('--arm'); cx.fill();
  // 夹爪两指
  const a = th + q0, nx = -Math.sin(a), ny = Math.cos(a), w = 18 + 22 * g;
  cx.lineWidth = Math.max(1.5, 7 * S); cx.strokeStyle = css('--ink');
  for (const s of [-1, 1]){ const q = [p[0] + s * nx * w, p[1] + s * ny * w]; cx.beginPath(); cx.moveTo(px(q[0] - Math.cos(a) * 20), py(q[1] - Math.sin(a) * 20)); cx.lineTo(px(q[0] + Math.cos(a) * 20), py(q[1] + Math.sin(a) * 20)); cx.stroke(); }
}

/* ---------- 机械臂侧视 ---------- */
const av = $('arm'), ax = av.getContext('2d');
function drawSide(f){
  const [t, x, y, th, q0, q1, q2, g] = f;
  const w = av.width, h = av.height, top = 46 * DPR;
  const s = Math.min(w / 470, (h - top - 8 * DPR) / 320);
  const ox = 170 * s, oy = h - 14 * s;
  const X = r => ox + r * s, Y = z => oy - z * s;
  ax.fillStyle = css('--panel'); ax.fillRect(0, 0, w, h);
  ax.font = `${12 * DPR}px "PingFang SC","Microsoft YaHei",sans-serif`; ax.textBaseline = 'middle';
  const hline = (z, txt) => { ax.strokeStyle = css('--line'); ax.lineWidth = DPR; ax.setLineDash([4 * DPR, 4 * DPR]); ax.beginPath(); ax.moveTo(0, Y(z)); ax.lineTo(w, Y(z)); ax.stroke(); ax.setLineDash([]); ax.fillStyle = css('--quiet'); ax.textAlign = 'right'; ax.fillText(txt, w - 4 * DPR, Y(z) - 8 * DPR); };
  hline(0, '地面'); hline(R.tray, `载物槽底 ${R.tray} mm`); hline(R.shz, `肩轴 ${R.shz} mm`);
  ax.fillStyle = css('--car-top'); ax.strokeStyle = css('--car'); ax.lineWidth = DPR;
  ax.fillRect(X(-160), Y(R.tray), 210 * s, R.tray * s); ax.strokeRect(X(-160), Y(R.tray), 210 * s, R.tray * s);
  ax.fillStyle = css('--quiet'); ax.textAlign = 'center'; ax.fillText('车体', X(-55), Y(R.tray / 2));
  const re = R.r0 + R.l1 * Math.cos(q1), ze = R.shz + R.l1 * Math.sin(q1);
  const rt = re + R.l2 * Math.cos(q1 + q2), zt = ze + R.l2 * Math.sin(q1 + q2);
  ax.strokeStyle = css('--arm'); ax.lineWidth = 8 * s; ax.lineCap = 'round';
  ax.beginPath(); ax.moveTo(X(0), Y(R.tray)); ax.lineTo(X(0), Y(R.shz)); ax.lineTo(X(R.r0), Y(R.shz)); ax.lineTo(X(re), Y(ze)); ax.lineTo(X(rt), Y(zt)); ax.stroke();
  ax.fillStyle = css('--ink'); for (const [r, z] of [[R.r0, R.shz], [re, ze]]){ ax.beginPath(); ax.arc(X(r), Y(z), 5 * s, 0, 7); ax.fill(); }
  ax.beginPath(); ax.arc(X(rt), Y(zt), 7 * s, 0, 7); ax.fillStyle = css('--accent'); ax.fill();
  ax.fillStyle = css('--ink'); ax.textAlign = 'left';
  ax.fillText(`夹持中心离地 ${zt.toFixed(0)} mm，离回转轴 ${rt.toFixed(0)} mm`, 4 * DPR, 12 * DPR);
  ax.fillStyle = css('--quiet');
  ax.fillText(`回转 ${(q0 * 57.3).toFixed(0)}°　肩 ${(q1 * 57.3).toFixed(0)}°　肘 ${(q2 * 57.3).toFixed(0)}°　夹爪${g > 0.6 ? '张开' : '合上'}`, 4 * DPR, 32 * DPR);
}

/* ---------- 日志 ---------- */
const logBox = $('log');
const logEls = DATA.logs.map(([t, s]) => {
  const d = document.createElement('div'); d.textContent = s; d.dataset.t = t;
  if (s.includes('[模拟]')) d.classList.add('sim');
  d.onclick = () => { seekTime(+d.dataset.t); };
  logBox.appendChild(d); return d;
});
let lastLog = -1;
function updateLog(tms){
  let k = -1;
  for (let i = 0; i < DATA.logs.length; i++){ if (DATA.logs[i][0] <= tms) k = i; else break; }
  if (k === lastLog) return;
  logEls.forEach((el, i) => { el.classList.toggle('future', i > k); el.classList.toggle('cur', i === k); });
  if (k >= 0) { const el = logEls[k]; logBox.scrollTop = el.offsetTop - logBox.offsetTop - logBox.clientHeight / 2; }
  lastLog = k;
  let grabs = 0, places = 0, phase = '准备出发';
  for (let i = 0; i <= k; i++){
    const s = DATA.logs[i][1];
    if (s.includes('[模拟] 夹住')) grabs++;
    if (s.includes('[模拟] 放在地面') || s.includes('[模拟] 叠放')) places++;
    const m = s.match(/==== (.+?) 开始/); if (m) phase = m[1];
    if (s.includes('任务码')) phase = phase === '准备出发' ? '读取二维码' : phase;
    if (s.includes('结束')) phase = '已结束';
  }
  $('sGrab').textContent = grabs; $('sPlace').textContent = places; $('phase').textContent = '当前阶段：' + phase;
}

/* ---------- 播放 ---------- */
let k = 0, playing = false, last = 0, tNow = 0;
const seek = $('seek'); seek.max = N - 1;
function frameAt(tms){ let lo = 0, hi = N - 1; while (lo < hi){ const m = (lo + hi + 1) >> 1; if (F[m][0] <= tms) lo = m; else hi = m - 1; } return lo; }
function seekTime(tms){ k = frameAt(tms); tNow = F[k][0]; draw(); }
function draw(){
  const f = F[k];
  drawField(); drawTrail(k);
  // 物料：按高度从低到高画；被夹住的最后画
  const ms = [];
  for (let i = 0; i < 6; i++){ const o = 8 + 4 * i, loc = f[o + 3]; if (loc) ms.push([f[o], f[o + 1], f[o + 2], DATA.colors[i], loc]); }
  const onCar = ms.filter(m => m[4] === 3 || m[4] === 4), off = ms.filter(m => m[4] !== 3 && m[4] !== 4);
  off.sort((a, b) => a[2] - b[2]).forEach(m => mat(...m));
  drawRobot(f);
  onCar.sort((a, b) => a[2] - b[2]).forEach(m => mat(...m));
  drawArm(f);
  drawSide(f);
  seek.value = k;
  $('time').textContent = `${(f[0] / 1000).toFixed(1)} s / ${(T_END / 1000).toFixed(1)} s`;
  const p = F[Math.max(0, k - 2)], v = Math.hypot(f[1] - p[1], f[2] - p[2]) / Math.max(1, (f[0] - p[0]) / 1000);
  $('sSpeed').textContent = Math.round(v);
  updateLog(f[0]);
}
function tick(ts){
  if (!playing) return;
  const dt = last ? ts - last : 0; last = ts;
  tNow += dt * (+$('speed').value);
  k = frameAt(tNow);
  if (k >= N - 1){ k = N - 1; playing = false; $('play').textContent = '重播'; }
  draw();
  if (playing) requestAnimationFrame(tick);
}
$('play').onclick = () => {
  if (k >= N - 1){ k = 0; }
  tNow = F[k][0];
  playing = !playing; $('play').textContent = playing ? '暂停' : '播放';
  last = 0; if (playing) requestAnimationFrame(tick);
};
seek.oninput = () => { k = +seek.value; tNow = F[k][0]; draw(); };
document.addEventListener('keydown', e => {
  if (e.code === 'Space'){ e.preventDefault(); $('play').click(); }
  if (e.code === 'ArrowRight'){ k = Math.min(N - 1, k + 20); tNow = F[k][0]; draw(); }
  if (e.code === 'ArrowLeft'){ k = Math.max(0, k - 20); tNow = F[k][0]; draw(); }
});
window.addEventListener('resize', fit);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', draw);
fit();
})();
</script>
</body>
</html>
